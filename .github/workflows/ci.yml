name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, impl/release-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AAR_LIVE: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Test
        run: pytest -q --junitxml=junit-linux-${{ matrix.python-version }}.xml
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-linux-${{ matrix.python-version }}
          path: junit-linux-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AAR_LIVE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install development dependencies
        id: install
        run: python -m pip install -e '.[dev]'
      - name: Test portable job store
        run: pytest -q tests/node/test_job_store_portability.py --junitxml=junit-windows-portability.xml
      - name: Test node suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -q tests/node -m "not live" --junitxml=junit-windows-node.xml
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-windows-3.12
          path: junit-windows-*.xml
          if-no-files-found: warn
